<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhanalakshmi A - Resume</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
  }
  .resume {
    max-width: 950px;
    margin: 30px auto;
    background: #fff;
    box-shadow: 0 0 15px rgba(0,0,0,0.15);
  }
  .header {
    background: #1e2a3a;
    color: #fff;
    padding: 35px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .header-left h1 {
    font-size: 32px;
    letter-spacing: 1px;
  }
  .header-left .title {
    color: #4fd1c5;
    font-size: 15px;
    margin-top: 4px;
  }
  .header-left .tagline {
    font-size: 13px;
    margin-top: 10px;
    color: #d0d0d0;
  }
  .avatar {
    width: 130px;
    height: 165px;
    border-radius: 2px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }
  .contact-bar {
    background: #16202c;
    color: #fff;
    padding: 15px 40px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    font-size: 14px;
  }
  .contact-bar div { margin: 4px 0; }
  .contact-bar a { color: #4fd1c5; text-decoration: none; }
  .contact-bar span.icon { margin-right: 6px; }

  .content {
    display: flex;
    padding: 30px 40px;
    gap: 40px;
  }
  .col-left, .col-right {
    flex: 1;
  }
  h2.section-title {
    color: #2b8a99;
    border-bottom: 2px solid #2b8a99;
    display: inline-block;
    font-size: 17px;
    margin-bottom: 12px;
    padding-bottom: 2px;
    letter-spacing: 0.5px;
  }
  .section { margin-bottom: 28px; }
  .edu-item, .cert-item { margin-bottom: 16px; }
  .edu-item .degree { font-weight: bold; font-size: 15px; }
  .edu-item .school { font-size: 14px; margin-top: 2px; }
  .edu-item .meta {
    display: flex;
    justify-content: space-between;
    font-style: italic;
    color: #2b8a99;
    font-size: 13px;
    margin-top: 3px;
  }
  ul { padding-left: 18px; font-size: 14px; line-height: 1.6; }
  .skills-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .skill-tag {
    background: #e2e2e2;
    color: #333;
    padding: 6px 14px;
    border-radius: 4px;
    font-size: 13px;
  }
  .personal-details ul, .languages p { font-size: 14px; }
  .declaration p { font-size: 14px; line-height: 1.6; }
  .declaration .sign {
    margin-top: 25px;
    display: flex;
    justify-content: space-between;
    font-size: 14px;
    font-weight: bold;
  }

  @media (max-width: 700px) {
    .content { flex-direction: column; }
    .header { flex-direction: column; text-align: center; gap: 15px; }
    .contact-bar { flex-direction: column; }
  }
</style>
</head>
